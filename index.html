<!DOCTYPE html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ACE9</title>
  </head>
  <body>
    <script>
      (function () {
        var LINKS = {
          android: "https://d1qyqtnmucxzqn.cloudfront.net/images/ACE9.apk",
          ios: "https://d1qyqtnmucxzqn.cloudfront.net/images/ace9ios.mobileconfig",
        };

        var PC_MESSAGE = "অনুগ্রহ করে মোবাইল ফোন ব্যবহার করুন।";

        var ua = navigator.userAgent || "";
        var platform = navigator.platform || "";
        var isIos =
          /iPhone|iPad|iPod/i.test(ua) ||
          (platform === "MacIntel" && navigator.maxTouchPoints > 1);

        if (isIos) {
          location.replace(LINKS.ios);
          return;
        }
        if (/Android/i.test(ua)) {
          location.replace(LINKS.android);
          return;
        }

        document.write("<p>" + PC_MESSAGE + "</p>");
      })();
    </script>
    <noscript>
      <p>অনুগ্রহ করে মোবাইল ফোন ব্যবহার করুন।</p>
    </noscript>
  </body>
</html>
